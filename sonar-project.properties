# === SonarCloud / SonarQube (має збігатися з проєктом у Sonar) ===
# У SonarCloud: після імпорту репозиторію скопіюй Project Key і Organization Key з налаштувань проєкту.
sonar.projectKey=nststl_project_analyz_refacor
sonar.organization=nststl
sonar.projectName=Library Management System

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Версія Python як у CI (.github/workflows/ci-pipeline.yml)
sonar.python.version=3.12

# Звіти з pytest (генеруються в CI перед сканом)
sonar.python.coverage.reportPaths=coverage.xml
sonar.junit.reportPaths=reports/junit.xml

# --- Якщо викладач використовує self-hosted SonarQube (не Cloud): ---
# Розкоментуй і вкажи URL інстансу; токен той самий SONAR_TOKEN у GitHub Secrets.
# sonar.host.url=https://sonar.example.com
