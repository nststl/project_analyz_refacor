name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# SonarCloud: SONAR_TOKEN у Secrets; опційно SONAR_HOST_URL=https://sonarcloud.io
permissions:
  contents: read
  pull-requests: read

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create report directories
        run: mkdir -p reports htmlcov

      - name: Run tests with coverage and JUnit XML
        run: |
          pytest tests \
            --junitxml=reports/junit.xml \
            --cov=models --cov=services --cov=storage --cov=patterns --cov=utils --cov=web \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Upload test and coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          if-no-files-found: error
          path: |
            coverage.xml
            reports/junit.xml
            htmlcov/

      - name: Verify SONAR_TOKEN secret exists
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN не налаштовано. SonarCloud → https://sonarcloud.io/account → вкладка Security → Generate Token. GitHub → Settings → Secrets → Actions, ім'я: SONAR_TOKEN."
            exit 1
          fi

      # Вузький CI-токен з майстра «Other CI» вміє лише upload; Quality Gate API повертає 404.
      - name: Verify SONAR_TOKEN can read Quality Gate API
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/sonar-api.json -w "%{http_code}" \
            -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=nststl_project_analyz_refacor&branch=main")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::SONAR_TOKEN не підходить для Quality Gate (HTTP ${HTTP_CODE}). Потрібен USER TOKEN: https://sonarcloud.io/account → Security → Generate Token. Або Organization Analysis Token: org nststl → Administration → Security. НЕ токен з «Analyze → Other CI»."
            cat /tmp/sonar-api.json 2>/dev/null || true
            exit 1
          fi
          echo "SONAR_TOKEN OK — Quality Gate API доступний"

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
