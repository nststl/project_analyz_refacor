name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Self-hosted SonarQube: SONAR_TOKEN + SONAR_HOST_URL у Secrets репозиторію
permissions:
  contents: read
  pull-requests: read

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create report directories
        run: mkdir -p reports htmlcov

      - name: Run tests with coverage and JUnit XML
        run: |
          pytest tests \
            --junitxml=reports/junit.xml \
            --cov=models --cov=services --cov=storage --cov=patterns --cov=utils --cov=web \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Upload test and coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          if-no-files-found: error
          path: |
            coverage.xml
            reports/junit.xml
            htmlcov/

      - name: Verify SonarQube secrets exist
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN не налаштовано. SonarQube → My Account → Security → Generate Token. Додай у GitHub → Settings → Secrets → Actions (ім'я: SONAR_TOKEN)."
            exit 1
          fi
          if [ -z "$SONAR_HOST_URL" ]; then
            echo "::error::SONAR_HOST_URL не налаштовано. Додай URL вашого SonarQube, напр. https://sonar.university.edu.ua (без слеша в кінці)."
            exit 1
          fi

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
