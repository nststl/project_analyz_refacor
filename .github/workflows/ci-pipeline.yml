name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# SonarCloud: SONAR_TOKEN у Secrets; опційно SONAR_HOST_URL=https://sonarcloud.io
permissions:
  contents: read
  pull-requests: read

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create report directories
        run: mkdir -p reports htmlcov

      - name: Run tests with coverage and JUnit XML
        run: |
          pytest tests \
            --junitxml=reports/junit.xml \
            --cov=models --cov=services --cov=storage --cov=patterns --cov=utils --cov=web \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Upload test and coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          if-no-files-found: error
          path: |
            coverage.xml
            reports/junit.xml
            htmlcov/

      - name: Verify SONAR_TOKEN secret exists
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN не налаштовано. SonarCloud → https://sonarcloud.io/account → вкладка Security → Generate Token. GitHub → Settings → Secrets → Actions, ім'я: SONAR_TOKEN."
            exit 1
          fi

      - name: Verify SONAR_TOKEN is valid
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/sonar-auth.json -w "%{http_code}" \
            -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/authentication/validate")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::SONAR_TOKEN невалідний (HTTP ${HTTP_CODE}). User token: sonarcloud.io/account → Security."
            cat /tmp/sonar-auth.json 2>/dev/null || true
            exit 1
          fi
          echo "SONAR_TOKEN OK"

      # Free plan: mainline-аналіз (без sonar.branch.name), QG — окремим кроком після upload
      - name: SonarCloud scan (push to main)
        if: github.event_name == 'push'
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: -Dsonar.branch.autoconfig.disabled=true

      - name: Wait for Quality Gate (push to main)
        if: github.event_name == 'push'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "Waiting for SonarCloud mainline Quality Gate..."
          for i in $(seq 1 36); do
            RESP=$(curl -s -w "\n%{http_code}" -u "${SONAR_TOKEN}:" \
              "https://sonarcloud.io/api/qualitygates/project_status?projectKey=nststl_project_analyz_refacor")
            HTTP_CODE=$(echo "$RESP" | tail -n1)
            BODY=$(echo "$RESP" | sed '$d')
            if [ "$HTTP_CODE" = "200" ]; then
              STATUS=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('projectStatus',{}).get('status',''))")
              echo "Quality Gate: $STATUS"
              if [ "$STATUS" = "OK" ]; then exit 0; fi
              if [ "$STATUS" = "ERROR" ]; then
                echo "::error::Quality Gate FAILED"
                echo "$BODY"
                exit 1
              fi
            else
              echo "Attempt $i/36 — HTTP $HTTP_CODE, retry in 10s..."
            fi
            sleep 10
          done
          echo "::error::Quality Gate check timeout (6 min)"
          exit 1

      - name: SonarCloud scan (pull request)
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true
