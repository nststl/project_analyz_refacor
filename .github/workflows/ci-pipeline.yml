name: CI Quality Gate

on:
  push:
    branches: [main, master, develop, kursova]
  pull_request:
    branches: [main, master, develop, kursova]

# Для SonarCloud (PR decoration) зручно мати read на pull-requests
permissions:
  contents: read
  pull-requests: read

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create report directories
        run: mkdir -p reports htmlcov

      - name: Run tests with coverage and JUnit XML
        run: |
          pytest tests \
            --junitxml=reports/junit.xml \
            --cov=models --cov=services --cov=storage --cov=patterns --cov=utils \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Upload test and coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          if-no-files-found: error
          path: |
            coverage.xml
            reports/junit.xml
            htmlcov/

      # SONAR_TOKEN — лише токен з SonarCloud (див. README). Рекомендовано Organization token з правами аналізу.
      # Офіційна дія замість застарілого sonarcloud-github-action: https://github.com/SonarSource/sonarqube-scan-action
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
